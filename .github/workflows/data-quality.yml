name: Data quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: data-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Lint
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts

      - name: Run tests
        run: >
          python -m pytest
          --junitxml=reports/junit.xml
          --html=reports/pytest-report.html
          --self-contained-html

      - name: Summarize the clean extract
        if: always()
        run: python -m clinic_dq run --dataset clean --report-dir reports/clean

      - name: Summarize seeded defects
        if: always()
        run: >
          python -m clinic_dq run
          --dataset defects
          --expect-failures
          --report-dir reports/defects

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-reports
          path: reports/
          if-no-files-found: error
